<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Hero Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
            background: #0a0a0a;
        }

        .hero-container {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 100%);
        }

        /* Multi-layer gradient background */
        .gradient-layer-1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #ff8a00, #ff3cac, #784ba0, #2b86c5);
            opacity: 1;
            z-index: 1;
        }

        .gradient-layer-2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 50%, rgba(255, 140, 0, 0.4), transparent 50%),
                         radial-gradient(circle at 30% 80%, rgba(120, 75, 160, 0.3), transparent 60%);
            z-index: 2;
            filter: blur(60px);
            opacity: 0.8;
        }

        .gradient-layer-3 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 40%, rgba(255, 255, 255, 0.1), transparent 40%);
            z-index: 3;
            filter: blur(40px);
        }

        /* Glow overlay for bloom effect */
        .glow-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 200, 100, 0.3), transparent 60%);
            z-index: 4;
            filter: blur(80px);
            opacity: 0.6;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 60px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            min-height: 100vh;
        }

        /* Left side - Text content */
        .text-content {
            z-index: 11;
        }

        .eyebrow {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 24px;
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            color: #0a2540;
            margin-bottom: 32px;
            letter-spacing: -2px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
        }

        .gradient-text::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            z-index: -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(20px);
            opacity: 0.5;
        }

        .description {
            font-size: 20px;
            line-height: 1.6;
            color: #0a2540;
            margin-bottom: 48px;
            max-width: 540px;
            font-weight: 400;
            opacity: 0.9;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .btn-primary {
            background: #0a2540;
            color: white;
            box-shadow: 0 10px 40px rgba(10, 37, 64, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(10, 37, 64, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #0a2540;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
        }

        /* Right side - 3D Particle Sphere */
        .visual-content {
            position: relative;
            z-index: 11;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sphere-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        /* Canvas for particles */
        #particleCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 80px rgba(255, 200, 100, 0.6));
        }

        /* Outer glow halo */
        .sphere-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 200, 100, 0.4), rgba(255, 140, 0, 0.2) 40%, transparent 70%);
            filter: blur(60px);
            animation: pulse 4s ease-in-out infinite;
        }

        /* Light diffusion layer */
        .light-diffusion {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 60%);
            filter: blur(80px);
            animation: rotate 20s linear infinite;
        }

        /* Bloom effect layer */
        .bloom-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), rgba(255, 200, 100, 0.1) 50%, transparent 70%);
            filter: blur(40px);
            animation: pulse 3s ease-in-out infinite alternate;
        }

        /* Bottom diagonal section */
        .diagonal-section {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.95), transparent);
            clip-path: polygon(0 50%, 100% 0, 100% 100%, 0 100%);
            z-index: 5;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%) translateY(0px);
            }
            50% {
                transform: translate(-50%, -50%) translateY(-20px);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
                gap: 60px;
                padding: 60px 40px;
            }

            h1 {
                font-size: 56px;
            }

            .sphere-container {
                width: 500px;
                height: 500px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 42px;
            }

            .description {
                font-size: 18px;
            }

            .sphere-container {
                width: 400px;
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <!-- Multi-layer gradient backgrounds -->
        <div class="gradient-layer-1"></div>
        <div class="gradient-layer-2"></div>
        <div class="gradient-layer-3"></div>
        <div class="glow-overlay"></div>

        <!-- Main content -->
        <div class="content-wrapper">
            <!-- Left side - Text -->
            <div class="text-content">
                <div class="eyebrow">Next Generation Platform</div>
                <h1>
                    Transform your business with 
                    <span class="gradient-text" data-text="intelligent">intelligent</span> 
                    solutions
                </h1>
                <p class="description">
                    Experience unparalleled performance and scalability. 
                    Our cutting-edge platform empowers teams to build, scale, 
                    and innovate faster than ever before.
                </p>
                <div class="cta-group">
                    <button class="btn btn-primary">Get Started</button>
                    <button class="btn btn-secondary">View Demo</button>
                </div>
            </div>

            <!-- Right side - 3D Particle Sphere -->
            <div class="visual-content">
                <div class="sphere-container">
                    <div class="light-diffusion"></div>
                    <div class="sphere-glow"></div>
                    <div class="bloom-layer"></div>
                    <canvas id="particleCanvas"></canvas>
                </div>
            </div>
        </div>

        <!-- Bottom diagonal section -->
        <div class="diagonal-section"></div>
    </div>

    <script>
        // 3D Particle Sphere Animation
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        const width = 600;
        const height = 600;
        canvas.width = width;
        canvas.height = height;

        const centerX = width / 2;
        const centerY = height / 2;
        const radius = 180;

        // Particle system
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                // Spherical coordinates
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                // Distance from center (concentrated towards center)
                const r = radius * Math.pow(Math.random(), 0.5);
                
                this.x = r * Math.sin(phi) * Math.cos(theta);
                this.y = r * Math.sin(phi) * Math.sin(theta);
                this.z = r * Math.cos(phi);
                
                // Size varies based on distance from center
                const distanceFromCenter = Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
                const normalizedDistance = distanceFromCenter / radius;
                
                // Smaller particles at edges, larger at center
                this.size = (1 - normalizedDistance * 0.7) * (Math.random() * 3 + 1);
                
                // Color based on distance from center
                if (normalizedDistance < 0.3) {
                    // Core - dark orange/black
                    this.color = `rgba(40, 20, 10, ${0.9 - normalizedDistance})`;
                } else if (normalizedDistance < 0.6) {
                    // Mid - orange/gold
                    this.color = `rgba(255, 140, 0, ${1 - normalizedDistance * 0.8})`;
                } else {
                    // Outer - bright yellow/white glow
                    this.color = `rgba(255, 220, 100, ${1 - normalizedDistance})`;
                }
                
                this.alpha = 1 - normalizedDistance * 0.5;
                
                // Rotation speed
                this.rotationSpeed = (Math.random() - 0.5) * 0.002;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                // Rotate particle around Y-axis
                this.angle += this.rotationSpeed;
                const cosAngle = Math.cos(this.angle);
                const sinAngle = Math.sin(this.angle);
                
                // Rotate
                const newX = this.x * cosAngle - this.z * sinAngle;
                const newZ = this.x * sinAngle + this.z * cosAngle;
                
                this.x = newX;
                this.z = newZ;
            }

            draw() {
                // Project 3D to 2D with perspective
                const scale = 300 / (300 + this.z);
                const x2d = centerX + this.x * scale;
                const y2d = centerY + this.y * scale;
                const size2d = this.size * scale;
                
                // Draw particle with glow
                ctx.globalAlpha = this.alpha * scale;
                
                // Outer glow
                const gradient = ctx.createRadialGradient(x2d, y2d, 0, x2d, y2d, size2d * 3);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.5, this.color.replace(/[\d.]+\)$/, '0.3)'));
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x2d, y2d, size2d * 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Core particle
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(x2d, y2d, size2d, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalAlpha = 1;
            }
        }

        // Create particle system
        const particles = [];
        const particleCount = 800;

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Animation loop
        let animationAngle = 0;
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            animationAngle += 0.003;
            
            // Sort particles by Z (back to front)
            particles.sort((a, b) => a.z - b.z);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }

        animate();

        // Add floating animation to canvas
        let floatOffset = 0;
        function floatAnimation() {
            floatOffset += 0.02;
            canvas.style.transform = `translate(-50%, calc(-50% + ${Math.sin(floatOffset) * 10}px))`;
            requestAnimationFrame(floatAnimation);
        }
        floatAnimation();
    </script>
</body>
</html>
